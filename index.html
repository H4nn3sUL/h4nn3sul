    * { box-sizing:border-box; }

    a { color:inherit; }

    .contact { display:inline-flex; align-items:center; gap:12px; text-decoration:none; font-size:14px; }
    .contact span { color:#858585; transition:transform .2s ease, color .2s ease; }
    .contact:hover span { color:#f3f3f3; transform:translate(3px,-3px); }
    footer { display:flex; justify-content:space-between; padding:20px 0 26px; border-top:1px solid #242424; color:#696969; font-size:11px; letter-spacing:.04em; }

    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } *,*::before,*::after { transition:none !important; } }
